<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zivara - Admin Inventory & Menu Manager</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gold: { 400: '#E5C06E', 500: '#D4AF37', 600: '#AA820A' },
            noir: { 950: '#070708', 900: '#0B0B0C', 800: '#18181B' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-noir-950 text-slate-200 font-sans min-h-screen p-4 sm:p-8">

  <div class="max-w-6xl mx-auto space-y-8">
    
    <!-- HEADER -->
    <div class="flex items-center justify-between border-b border-gold-500/20 pb-5">
      <div class="flex items-center gap-3">
        <img src="Logo.png" alt="Zivara" class="h-12 w-auto object-contain" />
        <div>
          <h1 class="text-xl sm:text-2xl font-serif text-white">Inventory & Taxonomy Hub</h1>
          <p class="text-xs text-gold-400">Manage Menus, Submenus & Live Products</p>
        </div>
      </div>
      <a href="index.html" class="bg-noir-900 border border-gold-500/30 hover:bg-gold-500 hover:text-noir-950 text-xs font-bold px-4 py-2 rounded-xl transition">
        View Live Store ↗
      </a>
    </div>

    <!-- TABS -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

      <!-- 1. CREATE MAIN MENU (1, 2, 3...) -->
      <div class="bg-noir-900 border border-gold-500/20 p-6 rounded-2xl shadow-xl space-y-4">
        <h2 class="text-base font-bold text-gold-400 flex items-center gap-2">
          <i data-lucide="folder-plus" class="w-4 h-4"></i> Add Main Menu
        </h2>
        <form onsubmit="handleCreateMenu(event)" class="space-y-3 text-xs">
          <div>
            <label class="block text-slate-400 mb-1">Menu Code (Order No)</label>
            <input type="text" id="menuCode" required placeholder="e.g. 1, 2, 3" class="w-full bg-noir-800 border border-gold-500/20 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-gold-500" />
          </div>
          <div>
            <label class="block text-slate-400 mb-1">Menu Name</label>
            <input type="text" id="menuName" required placeholder="e.g. Fine Jewelry" class="w-full bg-noir-800 border border-gold-500/20 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-gold-500" />
          </div>
          <div>
            <label class="block text-slate-400 mb-1">Icon</label>
            <select id="menuIcon" class="w-full bg-noir-800 border border-gold-500/20 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-gold-500">
              <option value="gem">Gem (Jewelry)</option>
              <option value="watch">Watch (Horology)</option>
              <option value="shirt">Shirt (Apparel)</option>
              <option value="briefcase">Briefcase (Bags)</option>
              <option value="crown">Crown (VIP/Exclusive)</option>
              <option value="sparkles">Sparkles (Generic)</option>
            </select>
          </div>
          <div class="flex items-center gap-2 pt-2">
            <input type="checkbox" id="menuActive" checked class="accent-gold-500 w-4 h-4" />
            <label for="menuActive" class="text-slate-300">Is Active</label>
          </div>
          <button type="submit" class="w-full bg-gold-500 hover:bg-gold-400 text-noir-950 font-bold py-2.5 rounded-xl transition">
            Save Menu
          </button>
        </form>
      </div>

      <!-- 2. CREATE SUBMENU (1A, 1B, 2A...) -->
      <div class="bg-noir-900 border border-gold-500/20 p-6 rounded-2xl shadow-xl space-y-4">
        <h2 class="text-base font-bold text-gold-400 flex items-center gap-2">
          <i data-lucide="git-branch" class="w-4 h-4"></i> Add Sub-Menu
        </h2>
        <form onsubmit="handleCreateSubmenu(event)" class="space-y-3 text-xs">
          <div>
            <label class="block text-slate-400 mb-1">Select Main Menu</label>
            <select id="subParentMenu" required onchange="autoSuggestSubmenuCode()" class="w-full bg-noir-800 border border-gold-500/20 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-gold-500">
              <!-- Dynamically populated -->
            </select>
          </div>
          <div>
            <label class="block text-slate-400 mb-1">Sub-Menu Code (e.g. 1A, 1B, 2A)</label>
            <input type="text" id="submenuCode" required placeholder="e.g. 1A" class="w-full bg-noir-800 border border-gold-500/20 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-gold-500" />
          </div>
          <div>
            <label class="block text-slate-400 mb-1">Sub-Menu Name</label>
            <input type="text" id="submenuName" required placeholder="e.g. Diamond Pendants" class="w-full bg-noir-800 border border-gold-500/20 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-gold-500" />
          </div>
          <div>
            <label class="block text-slate-400 mb-1">Icon</label>
            <select id="submenuIcon" class="w-full bg-noir-800 border border-gold-500/20 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-gold-500">
              <option value="sparkles">Sparkles</option>
              <option value="gem">Gem</option>
              <option value="watch">Watch</option>
              <option value="shirt">Shirt</option>
              <option value="briefcase">Briefcase</option>
            </select>
          </div>
          <div class="flex items-center gap-2 pt-2">
            <input type="checkbox" id="submenuActive" checked class="accent-gold-500 w-4 h-4" />
            <label for="submenuActive" class="text-slate-300">Is Active</label>
          </div>
          <button type="submit" class="w-full bg-gold-500 hover:bg-gold-400 text-noir-950 font-bold py-2.5 rounded-xl transition">
            Save Sub-Menu
          </button>
        </form>
      </div>

      <!-- 3. CREATE PRODUCT (Random ID + Custom Product Code) -->
      <div class="bg-noir-900 border border-gold-500/20 p-6 rounded-2xl shadow-xl space-y-4">
        <h2 class="text-base font-bold text-gold-400 flex items-center gap-2">
          <i data-lucide="package-plus" class="w-4 h-4"></i> Add New Product
        </h2>
        <form onsubmit="handleCreateProduct(event)" class="space-y-3 text-xs">
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-slate-400 mb-1">Product ID (Auto)</label>
              <input type="text" id="prodRandomId" readonly class="w-full bg-noir-950 border border-slate-700 rounded-xl px-3 py-2 text-gold-400 font-mono" />
            </div>
            <div>
              <label class="block text-slate-400 mb-1">Product Code (Admin)</label>
              <input type="text" id="prodCode" required placeholder="e.g. ZIV-WCH-01" class="w-full bg-noir-800 border border-gold-500/20 rounded-xl px-3 py-2 text-white uppercase focus:outline-none focus:border-gold-500" />
            </div>
          </div>
          <div>
            <label class="block text-slate-400 mb-1">Select Menu & Sub-Menu</label>
            <div class="grid grid-cols-2 gap-2">
              <select id="prodMenuSelect" onchange="loadSubmenuDropdownForProduct()" class="w-full bg-noir-800 border border-gold-500/20 rounded-xl px-3 py-2 text-white focus:outline-none"></select>
              <select id="prodSubmenuSelect" class="w-full bg-noir-800 border border-gold-500/20 rounded-xl px-3 py-2 text-white focus:outline-none"></select>
            </div>
          </div>
          <div>
            <label class="block text-slate-400 mb-1">Product Title</label>
            <input type="text" id="prodTitle" required placeholder="e.g. Gold Automatic Chrono" class="w-full bg-noir-800 border border-gold-500/20 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-gold-500" />
          </div>
          <div class="grid grid-cols-3 gap-2">
            <div>
              <label class="block text-slate-400 mb-1">Price (₹)</label>
              <input type="number" id="prodPrice" required placeholder="4999" class="w-full bg-noir-800 border border-gold-500/20 rounded-xl px-3 py-2 text-white" />
            </div>
            <div>
              <label class="block text-slate-400 mb-1">MRP (₹)</label>
              <input type="number" id="prodOrigPrice" placeholder="8999" class="w-full bg-noir-800 border border-gold-500/20 rounded-xl px-3 py-2 text-white" />
            </div>
            <div>
              <label class="block text-slate-400 mb-1">Stock Qty</label>
              <input type="number" id="prodStock" required value="10" class="w-full bg-noir-800 border border-gold-500/20 rounded-xl px-3 py-2 text-white" />
            </div>
          </div>
          <div>
            <label class="block text-slate-400 mb-1">Image URL</label>
            <input type="url" id="prodImageUrl" required placeholder="https://images.unsplash.com/..." class="w-full bg-noir-800 border border-gold-500/20 rounded-xl px-3 py-2 text-white focus:outline-none" />
          </div>
          <div class="flex items-center gap-2 pt-1">
            <input type="checkbox" id="prodActive" checked class="accent-gold-500 w-4 h-4" />
            <label for="prodActive" class="text-slate-300">Is Active (Visible on site)</label>
          </div>
          <button type="submit" class="w-full bg-gradient-to-r from-gold-500 to-gold-400 text-noir-950 font-bold py-2.5 rounded-xl transition">
            Save Product
          </button>
        </form>
      </div>

    </div>

    <!-- LIVE SUBMISSIONS TABLE PREVIEW -->
    <div class="bg-noir-900 border border-gold-500/20 rounded-2xl p-6 shadow-xl space-y-4">
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-bold text-gold-400 uppercase tracking-wider">Live Database Hierarchy Summary</h3>
        <button onclick="fetchAllData()" class="text-xs text-slate-400 hover:text-white flex items-center gap-1">
          <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Refresh
        </button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs border-collapse">
          <thead>
            <tr class="border-b border-gold-500/20 text-slate-400">
              <th class="p-2">Type</th>
              <th class="p-2">Code</th>
              <th class="p-2">Name / Title</th>
              <th class="p-2">Parent / Submenu</th>
              <th class="p-2">Status</th>
            </tr>
          </thead>
          <tbody id="liveHierarchyBody" class="divide-y divide-gold-500/10 text-slate-300">
            <tr><td colspan="5" class="p-3 text-center text-slate-500">Loading live data...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = "https://ybybvetysdqpfbvfznoq.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlieWJ2ZXR5c2RxcGZidmZ6bm9xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyODkyNDAsImV4cCI6MjEwNDg2NTI0MH0.wipbN28UaIRdiqwdoIMnmXeagXB1vKvS7B8quvlgcLo";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let cachedMenus = [];
    let cachedSubmenus = [];

    // Helper: Random Product ID Generator (e.g. ZIV-719382)
    function generateRandomProductId() {
      return "ZIV-" + Math.floor(100000 + Math.random() * 900000);
    }

    // 1. SAVE MAIN MENU
    async function handleCreateMenu(e) {
      e.preventDefault();
      const menu_code = document.getElementById('menuCode').value.trim();
      const name = document.getElementById('menuName').value.trim();
      const icon = document.getElementById('menuIcon').value;
      const is_active = document.getElementById('menuActive').checked;

      const { error } = await db.from('menus').insert([{ menu_code, name, icon, is_active }]);
      if (error) {
        alert("Error creating menu: " + error.message);
      } else {
        alert(`Menu "${name}" (Code: ${menu_code}) successfully saved!`);
        e.target.reset();
        fetchAllData();
      }
    }

    // 2. SAVE SUBMENU
    async function handleCreateSubmenu(e) {
      e.preventDefault();
      const menu_code = document.getElementById('subParentMenu').value;
      const submenu_code = document.getElementById('submenuCode').value.trim().toUpperCase();
      const name = document.getElementById('submenuName').value.trim();
      const icon = document.getElementById('submenuIcon').value;
      const is_active = document.getElementById('submenuActive').checked;

      const { error } = await db.from('submenus').insert([{ submenu_code, menu_code, name, icon, is_active }]);
      if (error) {
        alert("Error creating submenu: " + error.message);
      } else {
        alert(`Sub-Menu "${name}" (Code: ${submenu_code}) linked to Menu ${menu_code}!`);
        e.target.reset();
        fetchAllData();
      }
    }

    // 3. SAVE PRODUCT
    async function handleCreateProduct(e) {
      e.preventDefault();
      const product_id = document.getElementById('prodRandomId').value;
      const product_code = document.getElementById('prodCode').value.trim().toUpperCase();
      const menu_code = document.getElementById('prodMenuSelect').value;
      const submenu_code = document.getElementById('prodSubmenuSelect').value || null;
      const title = document.getElementById('prodTitle').value.trim();
      const price = parseFloat(document.getElementById('prodPrice').value);
      const original_price = document.getElementById('prodOrigPrice').value ? parseFloat(document.getElementById('prodOrigPrice').value) : null;
      const stock_quantity = parseInt(document.getElementById('prodStock').value, 10);
      const image_url = document.getElementById('prodImageUrl').value.trim();
      const is_active = document.getElementById('prodActive').checked;

      const { error } = await db.from('products').insert([{
        product_id, product_code, menu_code, submenu_code,
        title, price, original_price, stock_quantity, image_url, is_active
      }]);

      if (error) {
        alert("Error saving product: " + error.message);
      } else {
        alert(`Product "${title}" [Code: ${product_code}] added successfully!`);
        e.target.reset();
        document.getElementById('prodRandomId').value = generateRandomProductId();
        fetchAllData();
      }
    }

    // Populate Submenu dropdown based on selected Menu
    function loadSubmenuDropdownForProduct() {
      const selectedMenu = document.getElementById('prodMenuSelect').value;
      const subSelect = document.getElementById('prodSubmenuSelect');
      const filtered = cachedSubmenus.filter(s => s.menu_code === selectedMenu);

      subSelect.innerHTML = `<option value="">-- No Submenu --</option>` + 
        filtered.map(s => `<option value="${s.submenu_code}">${s.submenu_code} - ${s.name}</option>`).join('');
    }

    function autoSuggestSubmenuCode() {
      const selectedMenu = document.getElementById('subParentMenu').value;
      const count = cachedSubmenus.filter(s => s.menu_code === selectedMenu).length;
      const nextLetter = String.fromCharCode(65 + count); // 0 -> A, 1 -> B
      document.getElementById('submenuCode').value = `${selectedMenu}${nextLetter}`;
    }

    // Fetch live entries for dropdowns & preview table
    async function fetchAllData() {
      const { data: menus } = await db.from('menus').select('*').order('menu_code', { ascending: true });
      const { data: submenus } = await db.from('submenus').select('*').order('submenu_code', { ascending: true });
      const { data: prods } = await db.from('products').select('*').order('created_at', { ascending: false });

      cachedMenus = menus || [];
      cachedSubmenus = submenus || [];

      // Populate Menu dropdowns
      const menuOptions = cachedMenus.map(m => `<option value="${m.menu_code}">${m.menu_code} - ${m.name}</option>`).join('');
      document.getElementById('subParentMenu').innerHTML = menuOptions;
      document.getElementById('prodMenuSelect').innerHTML = menuOptions;

      loadSubmenuDropdownForProduct();
      autoSuggestSubmenuCode();

      // Render Table Preview
      const tbody = document.getElementById('liveHierarchyBody');
      let rows = '';

      cachedMenus.forEach(m => {
        rows += `<tr class="bg-noir-950/60 font-semibold"><td class="p-2 text-gold-400">MENU</td><td class="p-2">${m.menu_code}</td><td class="p-2">${m.name}</td><td class="p-2">-</td><td class="p-2">${m.is_active ? '✅ Active' : '❌ Inactive'}</td></tr>`;
      });

      cachedSubmenus.forEach(s => {
        rows += `<tr><td class="p-2 text-blue-400">SUB-MENU</td><td class="p-2">${s.submenu_code}</td><td class="p-2">${s.name}</td><td class="p-2">Under Menu ${s.menu_code}</td><td class="p-2">${s.is_active ? '✅ Active' : '❌ Inactive'}</td></tr>`;
      });

      (prods || []).forEach(p => {
        rows += `<tr class="text-slate-400"><td class="p-2 text-emerald-400">PRODUCT</td><td class="p-2 font-mono">${p.product_code}</td><td class="p-2 font-semibold text-slate-200">${p.title}</td><td class="p-2">Menu: ${p.menu_code} | Sub: ${p.submenu_code || 'None'}</td><td class="p-2">${p.is_active ? '✅ Live' : '❌ Hidden'}</td></tr>`;
      });

      tbody.innerHTML = rows || `<tr><td colspan="5" class="p-4 text-center text-slate-500">No records found. Add your first menu above!</td></tr>`;
      lucide.createIcons();
    }

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('prodRandomId').value = generateRandomProductId();
      lucide.createIcons();
      fetchAllData();
    });
  </script>
</body>
</html>
