<!-- STICKY TOP CONTAINER -->
<div class="sticky top-0 z-50 w-full shadow-2xl bg-noir-950">
  
  <!-- TOP ANNOUNCEMENT STRIP -->
  <div class="bg-noir-950 text-gold-400 text-xs py-1.5 px-4 text-center tracking-widest uppercase border-b border-gold-500/20 font-medium">
    ✨ Zivara Privé | Compliments on Orders Above ₹1,499 | Use Code <span class="text-white font-bold bg-gold-600/30 px-2 py-0.5 rounded border border-gold-400/40">ZIVARA10</span>
  </div>

  <!-- MAIN NAVBAR -->
  <header class="bg-noir-900/95 backdrop-blur-xl border-b border-gold-500/20">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4 sm:gap-6">
      
      <!-- LOGO -->
      <a href="index.html" class="flex items-center gap-3 shrink-0">
        <img src="Logo.png" alt="Zivara Logo" class="h-12 sm:h-16 w-auto object-contain drop-shadow-md transition transform hover:scale-105" />
      </a>

      <!-- SMART SEARCH BAR -->
      <div class="flex-1 max-w-2xl relative">
        <div class="relative flex items-center">
          <i data-lucide="search" class="w-4 h-4 text-gold-400 absolute left-3.5 pointer-events-none"></i>
          <input 
            type="text" 
            id="searchInput" 
            oninput="window.handleSearchInput(event)"
            placeholder="Search Luxury Couture, Watches, Jewelry..." 
            class="w-full pl-10 pr-16 sm:pr-20 py-2.5 sm:py-3 bg-noir-900 border border-gold-500/30 rounded-full text-xs text-white tracking-wide focus:outline-none focus:border-gold-400 focus:ring-1 focus:ring-gold-400/50 transition placeholder:text-slate-400 shadow-inner"
          />
          <button 
            id="clearSearchBtn" 
            onclick="window.resetSearch()" 
            class="hidden absolute right-12 text-slate-400 hover:text-white p-1 transition"
            title="Clear Search">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
          <button 
            onclick="window.triggerSearch()" 
            class="absolute right-1.5 px-3 sm:px-4 py-1.5 sm:py-2 bg-gradient-to-r from-gold-500 to-gold-400 hover:from-gold-400 hover:to-gold-300 text-noir-950 text-xs font-bold rounded-full transition shadow">
            <span class="hidden sm:inline">Search</span>
            <i data-lucide="arrow-right" class="w-3.5 h-3.5 sm:hidden"></i>
          </button>
        </div>
      </div>

      <!-- RIGHT ACTIONS -->
      <div class="flex items-center gap-4 sm:gap-6 shrink-0 text-xs font-semibold tracking-wider uppercase">
        <a href="login.html" id="userAuthBtn" class="flex flex-col items-center gap-1 text-slate-300 hover:text-gold-400 transition">
          <i data-lucide="user" class="w-5 h-5 text-gold-400"></i>
          <span id="userAuthText" class="text-[10px] sm:text-[11px] hidden sm:inline">Profile</span>
        </a>

        <a href="cart.html" class="flex flex-col items-center gap-1 text-slate-300 hover:text-gold-400 transition relative">
          <div class="relative">
            <i data-lucide="shopping-bag" class="w-5 h-5 text-gold-400"></i>
            <span id="cartCount" class="absolute -top-2 -right-3 bg-gradient-to-r from-gold-500 to-gold-400 text-noir-950 text-[10px] font-black px-1.5 py-0.2 rounded-full shadow">0</span>
          </div>
          <span class="text-[10px] sm:text-[11px] hidden sm:inline">Cart</span>
        </a>
      </div>
    </div>
  </header>

  <!-- HORIZONTAL MENUS BAR -->
  <nav class="bg-noir-900/95 border-b border-gold-500/15 py-2.5 relative z-40">
    <div class="max-w-7xl mx-auto px-4 relative flex items-center">
      
      <button onclick="window.scrollMenus(-180)" class="hidden md:flex absolute left-1 z-30 bg-noir-950/90 border border-gold-500/30 text-gold-400 p-1.5 rounded-full shadow hover:bg-noir-800 transition">
        <i data-lucide="chevron-left" class="w-4 h-4"></i>
      </button>

      <div id="categoryNavContainer" class="w-full flex items-center gap-7 text-xs font-bold uppercase tracking-wider text-slate-300 overflow-x-auto custom-scrollbar scroll-smooth px-2 sm:px-6 py-1">
        <button onclick="window.selectMenu(null, null, 'The Heritage Edit')" class="category-btn text-gold-400 border-b-2 border-gold-400 pb-0.5 flex items-center gap-1.5 shrink-0 transition">
          <i data-lucide="layout-grid" class="w-4 h-4"></i> All Collections
        </button>
      </div>

      <button onclick="window.scrollMenus(180)" class="hidden md:flex absolute right-1 z-30 bg-noir-950/90 border border-gold-500/30 text-gold-400 p-1.5 rounded-full shadow hover:bg-noir-800 transition">
        <i data-lucide="chevron-right" class="w-4 h-4"></i>
      </button>
    </div>
  </nav>
</div>
