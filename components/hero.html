<!-- HERO SECTION (4-SEC AUTOSCROLL SLIDER) -->
<div id="heroBannerSection" class="transition-all duration-300">
  <div class="bg-white/95 p-2 sm:p-4 rounded-3xl sm:rounded-[2.5rem] shadow-[0_20px_60px_-15px_rgba(255,255,255,0.08)] border border-white/40">
    <div class="relative w-full rounded-2xl sm:rounded-3xl overflow-hidden shadow-inner bg-noir-900 min-h-[260px] sm:min-h-[380px] flex items-center">
      
      <div id="bannerSlidesTrack" class="absolute inset-0 w-full h-full">
        <div class="banner-slide absolute inset-0 w-full h-full bg-cover bg-center opacity-100" style="background-image: url('Cover.png');"></div>
      </div>

      <div class="absolute inset-0 bg-gradient-to-r from-noir-950 via-noir-950/65 to-transparent z-10 pointer-events-none"></div>

      <div class="relative z-20 max-w-xl p-6 sm:p-14 space-y-3 sm:space-y-4">
        <span id="bannerSubtitle" class="inline-block px-3 py-1 bg-gold-500/20 backdrop-blur-md border border-gold-500/40 text-gold-300 rounded-full text-[10px] font-bold tracking-widest uppercase">
          Curated Luxury Edit 2026
        </span>
        <h1 id="bannerTitle" class="text-2xl sm:text-5xl font-serif font-normal tracking-tight text-white leading-tight drop-shadow-lg">
          Elegance is an Attitude.
        </h1>
        <p class="text-xs sm:text-sm text-slate-200 leading-relaxed font-light drop-shadow line-clamp-2 sm:line-clamp-none">
          Experience timeless sophistication with bespoke designer fashion, precision timepieces, and hand-finished jewelry.
        </p>
        <div class="pt-2">
          <a id="bannerBtn" href="#products-section" class="inline-flex items-center gap-2 bg-gradient-to-r from-gold-500 to-gold-400 hover:from-gold-400 hover:to-gold-300 text-noir-950 px-6 sm:px-7 py-2.5 sm:py-3 rounded-full font-bold text-xs uppercase tracking-widest shadow-xl transition transform hover:-translate-y-0.5">
            Shop The Edit <i data-lucide="arrow-right" class="w-4 h-4"></i>
          </a>
        </div>
      </div>

      <div id="bannerDots" class="absolute bottom-4 right-6 z-20 flex items-center gap-2"></div>
    </div>
  </div>

  <!-- VALUE STRIP -->
  <div class="mt-4 sm:mt-6 bg-noir-900/90 border border-gold-500/20 rounded-2xl py-3.5 px-4 sm:px-6 shadow-md grid grid-cols-1 sm:grid-cols-3 gap-3 text-center divide-y sm:divide-y-0 sm:divide-x divide-gold-500/10 text-xs font-semibold">
    <div class="flex items-center justify-center gap-2 text-slate-200 pt-1 sm:pt-0">
      <i data-lucide="rotate-ccw" class="w-4 h-4 text-gold-400"></i>
      <span>7 Days Seamless Replacement</span>
    </div>
    <div class="flex items-center justify-center gap-2 text-slate-200 pt-2 sm:pt-0">
      <i data-lucide="shield-check" class="w-4 h-4 text-gold-400"></i>
      <span>100% Certified Luxury Craftsmanship</span>
    </div>
    <div class="flex items-center justify-center gap-2 text-slate-200 pt-2 sm:pt-0">
      <i data-lucide="truck" class="w-4 h-4 text-gold-400"></i>
      <span>Free Insured White-Glove Transit</span>
    </div>
  </div>
</div>
