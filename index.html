<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zivara - Fashion • Style • You</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <link rel="stylesheet" href="css/styles.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gold: { 300: '#F5D77F', 400: '#E5C06E', 500: '#D4AF37', 600: '#AA820A' },
            noir: { 950: '#070708', 900: '#0B0B0C', 850: '#121214', 800: '#18181B' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-noir-950 text-slate-100 font-sans min-h-screen flex flex-col selection:bg-gold-500 selection:text-noir-950 pb-16 lg:pb-0">

  <!-- DYNAMIC INCLUDED COMPONENTS -->
  <div id="header-root"></div>
  
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6 flex-1 w-full">
    <div id="hero-root"></div>
    <div id="catalogue-root"></div>
  </main>

  <div id="footer-root"></div>

  <!-- ENTRY POINT (ES6 MODULE) -->
  <script type="module">
    import { refreshIcons } from './js/config.js';
    import { loadHeroBanners, goToSlide } from './js/slider.js';
    import { loadMenuSubmenu, scrollMenus } from './js/navbar.js';
    import { loadProducts, selectMenu, applyFiltersAndSort } from './js/products.js';
    import { addToCart, updateCartBadge } from './js/cart.js';

    // Global accessibility for HTML inline triggers
    window.goToSlide = goToSlide;
    window.scrollMenus = scrollMenus;
    window.selectMenu = selectMenu;
    window.addToCart = addToCart;
    window.applyFiltersAndSort = applyFiltersAndSort;

    // Fast Component Loader
    async function loadComponent(id, file) {
      const res = await fetch(file);
      document.getElementById(id).innerHTML = await res.text();
    }

    window.addEventListener('DOMContentLoaded', async () => {
      await Promise.all([
        loadComponent('header-root', 'components/header.html'),
        loadComponent('hero-root', 'components/hero.html'),
        loadComponent('catalogue-root', 'components/filters.html'),
        loadComponent('footer-root', 'components/footer.html')
      ]);

      refreshIcons();
      updateCartBadge();
      loadHeroBanners();
      loadMenuSubmenu();
      loadProducts();
    });
  </script>
</body>
</html>
